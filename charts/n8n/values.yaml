image:
  repository: docker.io/library/n8n-custom
  tag: 1.82.3-v1
  pullPolicy: IfNotPresent

main:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi

redis:
  image: redis:7.2-alpine
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 96Mi

postgres:
  instances: 1
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 384Mi
