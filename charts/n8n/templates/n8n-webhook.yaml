apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-webhook
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: webhook
spec:
  replicas: {{ .Values.webhook.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: n8n
      app.kubernetes.io/component: webhook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: n8n
        app.kubernetes.io/component: webhook
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: n8n-webhook
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - n8n
            - webhook
          ports:
            - containerPort: 5678
              name: http
          env:
            - name: EXECUTIONS_MODE
              value: "queue"
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "true"
            - name: N8N_LOG_LEVEL
              value: "info"
            # Database
            - name: DB_TYPE
              value: "postgresdb"
            - name: DB_POSTGRESDB_HOST
              value: "n8n-postgres-rw"
            - name: DB_POSTGRESDB_PORT
              value: "5432"
            - name: DB_POSTGRESDB_DATABASE
              value: "n8n"
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: n8n-db-creds
                  key: username
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-db-creds
                  key: password
            # Redis
            - name: QUEUE_BULL_REDIS_HOST
              value: "n8n-redis"
            - name: QUEUE_BULL_REDIS_PORT
              value: "6379"
            - name: QUEUE_BULL_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-redis-creds
                  key: password
            # Encryption Key
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-app-secrets
                  key: encryptionKey
            # Telemetry Off
            - name: N8N_TELEMETRY_ENABLED
              value: "false"
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5678
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- toYaml .Values.webhook.resources | nindent 12 }}
          volumeMounts:
            - name: n8n-storage
              mountPath: /home/node/.n8n
      volumes:
        - name: n8n-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-webhook
  labels:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: webhook
spec:
  selector:
    app.kubernetes.io/name: n8n
    app.kubernetes.io/component: webhook
  ports:
    - port: 5678
      targetPort: 5678
      name: http
