apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-bucket
  namespace: minio
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-mc
          image: rancher/mirrored-minio-mc:RELEASE.2022-12-13T00-23-28Z
          command:
            - /bin/sh
            - -c
            - |
              until mc alias set local http://minio.minio.svc.cluster.local:9000 minioadmin minioadminpassword; do
                echo "Waiting for MinIO..."
                sleep 2
              done
              mc mb --ignore-existing local/cnpg-backups
              echo "Bucket cnpg-backups is ready."
