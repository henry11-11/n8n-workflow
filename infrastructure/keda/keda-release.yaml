apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
  namespace: flux-system
spec:
  interval: 1h
  targetNamespace: keda
  timeout: 10m
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: keda
      version: ">=2.15.0 <3.0.0"
      sourceRef:
        kind: HelmRepository
        name: kedacore
        namespace: flux-system
  values:
    operator:
      resources:
        requests:
          cpu: 30m
          memory: 64Mi
        limits:
          cpu: 150m
          memory: 192Mi
    metricsServer:
      resources:
        requests:
          cpu: 30m
          memory: 64Mi
        limits:
          cpu: 150m
          memory: 192Mi
    webhooks:
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
